<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Four articulated monolith slabs: Triage, Act, Rework, Score -->
  <rect x="18" y="18" width="20" height="96" rx="4" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5" />
  <rect x="42" y="14" width="20" height="94" rx="4" fill="#2563EB" stroke="#93C5FD" stroke-width="1.5" />
  <rect x="66" y="18" width="20" height="94" rx="4" fill="#3B82F6" stroke="#93C5FD" stroke-width="1.5" />
  <rect x="90" y="22" width="20" height="92" rx="4" fill="#1D4ED8" stroke="#93C5FD" stroke-width="1.5" />

  <!-- Subtle hinge/articulation segments -->
  <line x1="21" y1="64" x2="35" y2="64" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.55" />
  <line x1="45" y1="60" x2="59" y2="60" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.55" />
  <line x1="69" y1="64" x2="83" y2="64" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.55" />
  <line x1="93" y1="68" x2="107" y2="68" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.55" />

  <!-- Bright cyan telemetry display slit on the second slab -->
  <rect x="45.5" y="26" width="13" height="6" rx="2" fill="#38BDF8" />
</svg>
